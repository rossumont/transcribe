<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transcribe – Live English Notes</title>
<style>
:root{--bg:#f5f6fa;--panel:#fff;--ink:#1d2433;--mute:#6b7385;--line:#e3e6ee;--accent:#2f6fed;--accent2:#e9f0ff;--rec:#e5484d;--hl:#fff3bf;--ok:#1f9d63}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai","Sarabun",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100dvh;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit}
button{cursor:pointer}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
header h1{font-size:18px;margin:0;line-height:1.1}
header small{color:var(--mute);font-size:12px}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:7px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#c5cad6}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.on{background:var(--accent2);border-color:var(--accent);color:var(--accent)}
.icon{padding:7px 10px}
.wrap{flex:1;display:flex;min-height:0}
aside{width:270px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside .top{padding:12px;border-bottom:1px solid var(--line)}
aside .top .btn{width:100%;justify-content:center}
#noteList{overflow:auto;flex:1;padding:6px}
.ni{padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:2px;position:relative}
.ni:hover{background:#f2f4f8}
.ni.act{background:var(--accent2)}
.ni b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:22px}
.ni span{font-size:12px;color:var(--mute)}
.ni .x{position:absolute;right:6px;top:8px;border:0;background:none;color:#aab;font-size:16px;padding:2px 6px;border-radius:6px}
.ni .x:hover{color:var(--rec);background:#fde8e8}
main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.head{padding:14px 22px 8px;background:var(--bg)}
#title{font-size:22px;font-weight:700;border:0;background:transparent;width:100%;outline:none;color:var(--ink);padding:2px 0}
#meta{color:var(--mute);font-size:13px;margin-top:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px;padding:8px 22px 10px;border-bottom:1px solid var(--line);align-items:center}
.tools input[type=search]{border:1px solid var(--line);border-radius:10px;padding:7px 12px;min-width:160px;flex:1;max-width:280px;background:var(--panel)}
.tools select{border:1px solid var(--line);border-radius:10px;padding:7px 8px;background:var(--panel)}
.menu{position:relative}
.menu .dd{display:none;position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;z-index:30;min-width:190px}
.menu.open .dd{display:block}
.dd button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:8px;font-size:14px}
.dd button:hover{background:#f2f4f8}
#transcript{flex:1;overflow:auto;padding:14px 22px 190px}
.seg{display:flex;gap:14px;padding:10px 12px;border-radius:12px;margin-bottom:4px;border:1px solid transparent}
.seg:hover{background:var(--panel);border-color:var(--line)}
.seg.star{background:var(--hl)}
.seg.play{border-color:var(--accent);background:var(--accent2)}
.seg .m{width:110px;flex-shrink:0;display:flex;flex-direction:column;gap:4px}
.seg select{border:0;background:transparent;font-weight:600;font-size:13px;padding:0;max-width:110px;color:var(--c,#333)}
.seg .ts{font-size:12px;color:var(--accent);font-family:ui-monospace,Menlo,monospace;cursor:pointer;border:0;background:none;padding:0;text-align:left}
.seg .stb{border:0;background:none;padding:0;font-size:15px;color:#c9ccd6;text-align:left}
.seg.star .stb{color:#e0a100}
.seg .tx{flex:1;font-size:17px;line-height:1.6;outline:none;min-width:0;word-wrap:break-word}
.seg .tx:focus{background:#fff;box-shadow:0 0 0 2px var(--accent2);border-radius:6px}
#interim{color:var(--mute);font-style:italic;font-size:17px;line-height:1.6;padding:6px 12px 6px 136px}
.empty{text-align:center;color:var(--mute);margin-top:12vh;line-height:1.7}
.empty .big{font-size:48px}
.warn{background:#fff4e5;border:1px solid #f5c98b;color:#8a5300;border-radius:12px;padding:10px 14px;margin:0 22px 8px;font-size:14px;display:none}
mark{background:#ffe066;border-radius:3px}
/* floating bottom bar */
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:20;width:min(96vw,640px)}
#player{display:none;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 10px;box-shadow:0 6px 20px rgba(0,0,0,.08);align-items:center;gap:8px}
#player audio{flex:1;height:36px;min-width:0}
#player select{border:1px solid var(--line);border-radius:8px;padding:4px}
.pill{display:flex;align-items:center;gap:10px;background:#1d2433;color:#fff;border-radius:40px;padding:8px 10px;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.pill .spk{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:20px;padding:8px 12px;font-size:13px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#clock{font-family:ui-monospace,Menlo,monospace;font-size:20px;min-width:96px;text-align:center;letter-spacing:.5px}
.rb{width:52px;height:52px;border-radius:50%;border:0;display:grid;place-items:center;font-size:20px;color:#fff;background:var(--rec)}
.rb.go{background:var(--ok)}
.sb{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:15px}
.sb:disabled{opacity:.3;cursor:default}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rec);display:none;animation:bl 1s infinite}
.recording .dot{display:block}
@keyframes bl{50%{opacity:.2}}
footer{font-size:11px;color:var(--mute);text-align:center;padding:4px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,20,30,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.show{display:flex}
.box{background:var(--panel);border-radius:16px;padding:20px;width:min(440px,100%);max-height:85vh;overflow:auto}
.box h3{margin:0 0 12px}
.box .row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.box .row input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px}
.box .cl{width:14px;height:14px;border-radius:50%}
.bar{height:10px;background:#eef0f5;border-radius:10px;overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.bar.ind i{width:35%;animation:ind 1.3s infinite ease-in-out}
@keyframes ind{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
#toast.show{opacity:1}
#menuBtn{display:none}
@media (max-width:820px){
  #menuBtn{display:inline-flex}
  aside{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 24px rgba(0,0,0,.15)}
  aside.open{transform:none}
  .seg{flex-direction:column;gap:2px}
  .seg .m{flex-direction:row;width:auto;align-items:center;gap:12px}
  #interim{padding-left:12px}
  .head,.tools,#transcript{padding-left:14px;padding-right:14px}
  header small{display:none}
}
</style>
</head>
<body>
<header>
  <button class="btn icon" id="menuBtn" onclick="toggleAside()">☰</button>
  <div class="logo">T</div>
  <div><h1 data-i="app">Transcribe</h1><small data-i="sub">Live speech-to-text notes</small></div>
  <div class="sp"></div>
  <button class="btn" id="langBtn" onclick="toggleLang()">ไทย</button>
</header>

<div class="wrap">
  <aside id="aside">
    <div class="top"><button class="btn pri" onclick="newNote(true)">＋ <span data-i="newNote">New note</span></button></div>
    <div id="noteList"></div>
    <footer>Data stays on this device</footer>
  </aside>

  <main>
    <div class="head">
      <input id="title" data-ph="untitled" placeholder="Untitled note" oninput="setTitle(this.value)">
      <div id="meta"></div>
    </div>
    <div class="tools">
      <input type="search" id="q" data-ph="search" placeholder="Search transcript…" oninput="render()">
      <button class="btn" id="starBtn" onclick="toggleStarFilter()">★ <span data-i="hl">Highlights</span></button>
      <select id="srLang" title="Language" onchange="localStorage.setItem('tr_srlang',this.value)">
        <option value="en-US" data-i="L_enUS">English (US)</option>
        <option value="en-GB" data-i="L_enGB">English (UK)</option>
        <option value="en-AU" data-i="L_enAU">English (Australia)</option>
        <option value="en-IN" data-i="L_enIN">English (India)</option>
        <option value="zh-CN" data-i="L_zhCN">Chinese (Mandarin, Simplified)</option>
        <option value="zh-TW" data-i="L_zhTW">Chinese (Taiwan, Traditional)</option>
        <option value="es-ES" data-i="L_esES">Spanish (Spain)</option>
        <option value="es-MX" data-i="L_esMX">Spanish (Mexico)</option>
        <option value="ja-JP" data-i="L_ja">Japanese</option>
      </select>
      <button class="btn" onclick="openSpk()">🗣 <span data-i="speakers">Speakers</span></button>
      <button class="btn" onclick="document.getElementById('file').click()">⬆ <span data-i="upload">Upload audio</span></button>
      <input type="file" id="file" accept="audio/*,video/*" hidden onchange="onFile(this)">
      <div class="menu" id="expMenu">
        <button class="btn" onclick="toggleMenu(event)">⤓ <span data-i="export">Export</span></button>
        <div class="dd">
          <button onclick="exportTxt()" data-i="txt">Text file (.txt)</button>
          <button onclick="exportSrt()" data-i="srt">Subtitles (.srt)</button>
          <button onclick="copyAll()" data-i="copy">Copy all text</button>
          <button onclick="exportAudio()" data-i="audioDl">Download audio</button>
        </div>
      </div>
    </div>
    <div class="warn" id="warn"></div>
    <div id="transcript"></div>
  </main>
</div>

<div id="dock">
  <div id="player">
    <audio id="audio" controls preload="metadata"></audio>
    <select id="rate" onchange="audio.playbackRate=+this.value">
      <option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option>
    </select>
  </div>
  <div class="pill" id="pill">
    <button class="spk" id="curSpkBtn" onclick="cycleCurSpk()" title="Speaker for new lines"></button>
    <button class="rb" id="recBtn" onclick="recMain()">●</button>
    <div class="dot"></div>
    <div id="clock">00:00.0</div>
    <button class="sb" id="stopBtn" onclick="stopRec()" disabled title="Stop">■</button>
  </div>
</div>

<!-- speakers modal -->
<div class="ov" id="spkOv">
  <div class="box">
    <h3 data-i="speakers">Speakers</h3>
    <div id="spkRows"></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn" onclick="addSpk()">＋ <span data-i="addSpk">Add speaker</span></button>
      <div class="sp"></div>
      <button class="btn pri" onclick="closeSpk()" data-i="done">Done</button>
    </div>
  </div>
</div>

<!-- upload modal -->
<div class="ov" id="upOv">
  <div class="box">
    <h3 data-i="upTitle">Transcribe audio file</h3>
    <div id="upFileName" style="color:var(--mute);font-size:14px;word-break:break-all"></div>
    <div style="font-size:14px;margin-top:8px"><span data-i="upLang">Language</span>: <b id="upLangName"></b></div>
    <div id="upSetup">
      <p style="font-size:14px;line-height:1.6" data-i="upInfo">Runs entirely on this device. The first time, the speech model is downloaded (once) — then it is reused.</p>
      <label style="font-size:14px"><span data-i="quality">Quality</span>:
        <select id="model" style="border:1px solid var(--line);border-radius:8px;padding:6px">
          <option value="Xenova/whisper-tiny.en" data-i="mFast">Fast (≈40 MB)</option>
          <option value="Xenova/whisper-base.en" data-i="mAcc">More accurate (≈80 MB)</option>
        </select>
      </label>
      <div style="display:flex;gap:8px;margin-top:16px">
        <div class="sp"></div>
        <button class="btn" onclick="closeUp()" data-i="cancel">Cancel</button>
        <button class="btn pri" onclick="runWhisper()" data-i="start">Start</button>
      </div>
    </div>
    <div id="upRun" style="display:none">
      <div id="upStatus" style="font-size:14px;margin-top:10px"></div>
      <div class="bar" id="upBar"><i></i></div>
      <div id="upTime" style="font-size:12px;color:var(--mute)"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ---------- language ----------
const T = {
 en:{app:"Transcribe",sub:"Live speech-to-text notes",upLang:"Language",L_enUS:"English (US)",L_enGB:"English (UK)",L_enAU:"English (Australia)",L_enIN:"English (India)",L_zhCN:"Chinese (Mandarin, Simplified)",L_zhTW:"Chinese (Taiwan, Traditional)",L_esES:"Spanish (Spain)",L_esMX:"Spanish (Mexico)",L_ja:"Japanese",newNote:"New note",untitled:"Untitled note",search:"Search transcript…",
  hl:"Highlights",speakers:"Speakers",upload:"Upload audio",export:"Export",txt:"Text file (.txt)",srt:"Subtitles (.srt)",copy:"Copy all text",
  audioDl:"Download audio",addSpk:"Add speaker",done:"Done",upTitle:"Transcribe audio file",
  upInfo:"Runs entirely on this device. The first time, the speech model is downloaded (once) — then it is reused.",
  quality:"Quality",mFast:"Fast (≈40 MB)",mAcc:"More accurate (≈80 MB)",cancel:"Cancel",start:"Start",
  emptyA:"Press the red button to start recording.",emptyB:"Pick a language, then speak — words appear here live.",emptyC:"Or upload an audio file to transcribe it.",
  noMatch:"No matching lines.",words:"words",lines:"lines",speaker:"Speaker",
  noSR:"Live transcription needs Chrome, Edge or Safari. You can still upload audio files.",
  micDenied:"Microphone access was blocked. Allow the microphone for this site in your browser settings, then try again.",
  delQ:"Delete this note? This cannot be undone.",copied:"Copied",noAudio:"No audio saved for this note",nothing:"Nothing to export yet",
  loadModel:"Downloading speech model…",decoding:"Reading audio file…",transcribing:"Transcribing… (long files take a while — keep this page open)",
  upDone:"Done!",upFail:"Could not transcribe: ",netFail:"Needs internet the first time to download the model.",
  elapsed:"Elapsed",newRecQ:"This note already has text. Start a new note for this recording?",
  netLost:"Speech service unavailable (needs internet). Recording paused.",listening:"Listening…",paused:"Paused",
  fileNote:"Uploaded"},
 th:{app:"ถอดเสียง",sub:"แปลงเสียงพูดเป็นข้อความแบบสด",upLang:"ภาษา",L_enUS:"อังกฤษ (อเมริกัน)",L_enGB:"อังกฤษ (บริติช)",L_enAU:"อังกฤษ (ออสเตรเลีย)",L_enIN:"อังกฤษ (อินเดีย)",L_zhCN:"จีน (จีนกลาง ตัวย่อ)",L_zhTW:"จีน (ไต้หวัน ตัวเต็ม)",L_esES:"สเปน (สเปน)",L_esMX:"สเปน (เม็กซิโก)",L_ja:"ญี่ปุ่น",newNote:"โน้ตใหม่",untitled:"โน้ตไม่มีชื่อ",search:"ค้นหาในข้อความ…",
  hl:"ไฮไลต์",speakers:"ผู้พูด",upload:"อัปโหลดไฟล์เสียง",export:"ส่งออก",txt:"ไฟล์ข้อความ (.txt)",srt:"ไฟล์ซับไตเติล (.srt)",copy:"คัดลอกข้อความทั้งหมด",
  audioDl:"ดาวน์โหลดเสียง",addSpk:"เพิ่มผู้พูด",done:"เสร็จ",upTitle:"ถอดเสียงจากไฟล์",
  upInfo:"ประมวลผลในเครื่องนี้ทั้งหมด ครั้งแรกจะดาวน์โหลดโมเดลเสียง (ครั้งเดียว) ครั้งต่อไปใช้ซ้ำได้เลย",
  quality:"คุณภาพ",mFast:"เร็ว (≈40 MB)",mAcc:"แม่นยำกว่า (≈80 MB)",cancel:"ยกเลิก",start:"เริ่ม",
  emptyA:"กดปุ่มแดงเพื่อเริ่มอัดเสียง",emptyB:"เลือกภาษา แล้วพูด — ข้อความจะขึ้นตรงนี้ทันที",emptyC:"หรืออัปโหลดไฟล์เสียงเพื่อถอดความ",
  noMatch:"ไม่พบบรรทัดที่ตรงกัน",words:"คำ",lines:"บรรทัด",speaker:"ผู้พูด",
  noSR:"การถอดเสียงสดต้องใช้ Chrome, Edge หรือ Safari แต่ยังอัปโหลดไฟล์เสียงได้",
  micDenied:"ไมโครโฟนถูกบล็อก ให้อนุญาตไมค์สำหรับเว็บนี้ในการตั้งค่าเบราว์เซอร์ แล้วลองใหม่",
  delQ:"ลบโน้ตนี้? ลบแล้วกู้คืนไม่ได้",copied:"คัดลอกแล้ว",noAudio:"โน้ตนี้ไม่มีไฟล์เสียง",nothing:"ยังไม่มีข้อความให้ส่งออก",
  loadModel:"กำลังดาวน์โหลดโมเดลเสียง…",decoding:"กำลังอ่านไฟล์เสียง…",transcribing:"กำลังถอดเสียง… (ไฟล์ยาวใช้เวลานาน อย่าปิดหน้านี้)",
  upDone:"เสร็จแล้ว!",upFail:"ถอดเสียงไม่สำเร็จ: ",netFail:"ครั้งแรกต้องต่ออินเทอร์เน็ตเพื่อดาวน์โหลดโมเดล",
  elapsed:"ใช้เวลา",newRecQ:"โน้ตนี้มีข้อความแล้ว จะเริ่มโน้ตใหม่สำหรับการอัดครั้งนี้ไหม?",
  netLost:"บริการถอดเสียงใช้ไม่ได้ (ต้องต่ออินเทอร์เน็ต) หยุดอัดชั่วคราว",listening:"กำลังฟัง…",paused:"หยุดชั่วคราว",
  fileNote:"อัปโหลด"}
};
let lang = localStorage.getItem('tr_lang') || 'en';
const t = k => (T[lang][k] ?? T.en[k] ?? k);
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
  document.getElementById('langBtn').textContent = lang==='en' ? 'ไทย' : 'EN';
  if(!SR) showWarn(t('noSR'));
  renderList(); render(); updSpkBtn();
}
function toggleLang(){ lang = lang==='en'?'th':'en'; localStorage.setItem('tr_lang',lang); applyLang(); }

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const audio = $('audio');
const COLORS = ['#2f6fed','#d6336c','#1f9d63','#e8590c','#7048e8','#0c8599','#a61e4d','#5c940d'];
const esc = s => s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmt(s, tenth){ s=Math.max(0,s||0); const h=Math.floor(s/3600), m=Math.floor(s/60)%60, x=Math.floor(s%60);
  let r=(h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(x).padStart(2,'0');
  if(tenth) r+='.'+Math.floor((s*10)%10); return r; }
function toast(m){ const e=$('toast'); e.textContent=m; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),1800); }
function showWarn(m){ const w=$('warn'); w.textContent=m; w.style.display=m?'block':'none'; }
function download(name, blob){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000); }
const safeName = s => (s||'transcript').replace(/[\\/:*?"<>|]+/g,'_').slice(0,60);

// ---------- storage (text: localStorage, audio: IndexedDB) ----------
const KEY='tr_notes_v1';
let notes = []; try{ notes = JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ notes=[]; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(notes)); }catch(e){ toast('Storage full'); } }
let dbP=null;
function db(){ if(!dbP) dbP=new Promise((res,rej)=>{ const r=indexedDB.open('tr_audio',1); r.onupgradeneeded=()=>r.result.createObjectStore('a'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); return dbP; }
async function idb(mode, fn){ const d=await db(); return new Promise((res,rej)=>{ const tx=d.transaction('a',mode); const rq=fn(tx.objectStore('a')); tx.oncomplete=()=>res(rq&&rq.result); tx.onerror=()=>rej(tx.error); }); }
const putAudio=(id,b)=>idb('readwrite',s=>s.put(b,id));
const getAudio=id=>idb('readonly',s=>s.get(id));
const delAudio=id=>idb('readwrite',s=>s.delete(id));

// ---------- notes ----------
let cur=null, starOnly=false, curSpk=0, audioUrl=null;
function newNote(open){
  const n={id:'n'+Date.now()+Math.random().toString(36).slice(2,6),title:'',created:Date.now(),duration:0,speakers:['Speaker 1','Speaker 2'],segs:[],hasAudio:false};
  notes.unshift(n); save(); if(open!==false) openNote(n.id); closeAside(); return n;
}
async function openNote(id){
  if(state!=='idle') return;
  cur=notes.find(n=>n.id===id); if(!cur) return;
  curSpk=0; $('title').value=cur.title; $('q').value='';
  if(audioUrl){ URL.revokeObjectURL(audioUrl); audioUrl=null; }
  audio.removeAttribute('src'); audio.load();
  $('player').style.display='none';
  if(cur.hasAudio){ try{ const b=await getAudio(cur.id); if(b){ audioUrl=URL.createObjectURL(b); audio.src=audioUrl; $('player').style.display='flex'; } }catch(e){} }
  renderList(); render(); updSpkBtn(); closeAside();
}
function delNote(id,ev){
  ev.stopPropagation(); if(state!=='idle') return;
  if(!confirm(t('delQ'))) return;
  notes=notes.filter(n=>n.id!==id); save(); delAudio(id).catch(()=>{});
  if(cur&&cur.id===id){ if(!notes.length) newNote(false); openNote(notes[0].id); } else renderList();
}
function setTitle(v){ if(!cur) return; cur.title=v; save(); renderList(); }
function renderList(){
  const L=$('noteList'); L.innerHTML='';
  notes.forEach(n=>{
    const d=document.createElement('div'); d.className='ni'+(cur&&n.id===cur.id?' act':'');
    const dt=new Date(n.created).toLocaleString(lang==='th'?'th-TH':'en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
    d.innerHTML=`<b>${esc(n.title||t('untitled'))}</b><span>${dt} · ${fmt(n.duration)}</span><button class="x" title="Delete">×</button>`;
    d.onclick=()=>openNote(n.id); d.querySelector('.x').onclick=e=>delNote(n.id,e);
    L.appendChild(d);
  });
}
function toggleAside(){ $('aside').classList.toggle('open'); }
function closeAside(){ $('aside').classList.remove('open'); }

// ---------- transcript render ----------
function render(){
  const box=$('transcript'); if(!cur){ box.innerHTML=''; return; }
  const q=$('q').value.trim().toLowerCase();
  const words=cur.segs.reduce((a,s)=>a+(s.text.match(/[\u3040-\u30ff\u3400-\u9fff]|[^\s\u3040-\u30ff\u3400-\u9fff]+/g)||[]).length,0);
  const dt=new Date(cur.created).toLocaleString(lang==='th'?'th-TH':'en-GB',{dateStyle:'medium',timeStyle:'short'});
  $('meta').textContent=`${dt} · ${fmt(cur.duration)} · ${words} ${t('words')} · ${cur.segs.length} ${t('lines')}`;
  box.innerHTML='';
  if(!cur.segs.length && state==='idle'){
    box.innerHTML=`<div class="empty"><div class="big">🎙</div>${t('emptyA')}<br>${t('emptyB')}<br><span style="font-size:14px">${t('emptyC')}</span></div>`; return;
  }
  let shown=0;
  cur.segs.forEach((s,i)=>{
    if(starOnly && !s.star) return;
    if(q && !s.text.toLowerCase().includes(q) && !(cur.speakers[s.spk]||'').toLowerCase().includes(q)) return;
    shown++;
    const d=document.createElement('div'); d.className='seg'+(s.star?' star':''); d.dataset.i=i;
    const opts=cur.speakers.map((n,k)=>`<option value="${k}"${k===s.spk?' selected':''}>${esc(n)}</option>`).join('');
    d.innerHTML=`<div class="m"><select style="--c:${COLORS[s.spk%COLORS.length]}">${opts}</select><button class="ts">${fmt(s.t)}</button><button class="stb" title="Highlight">★</button></div><div class="tx" contenteditable="true" spellcheck="false"></div>`;
    const tx=d.querySelector('.tx');
    if(q){ const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'); tx.innerHTML=esc(s.text).replace(re,'<mark>$1</mark>'); } else tx.textContent=s.text;
    tx.onblur=()=>{ const v=tx.textContent.trim(); if(v!==s.text){ if(v){ s.text=v; } else { cur.segs.splice(i,1); } save(); render(); } };
    tx.onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); tx.blur(); } };
    d.querySelector('select').onchange=e=>{ s.spk=+e.target.value; save(); render(); };
    d.querySelector('.ts').onclick=()=>seek(s.t);
    d.querySelector('.stb').onclick=()=>{ s.star=!s.star; save(); render(); };
    box.appendChild(d);
  });
  if(!shown && cur.segs.length) box.innerHTML=`<div class="empty">${t('noMatch')}</div>`;
  if(state!=='idle'){ const im=document.createElement('div'); im.id='interim'; im.textContent=interimText || (state==='rec'?t('listening'):t('paused')); box.appendChild(im); }
}
function toggleStarFilter(){ starOnly=!starOnly; $('starBtn').classList.toggle('on',starOnly); render(); }
function seek(sec){ if(!audio.src||state!=='idle'){ return; } audio.currentTime=sec; audio.play().catch(()=>{}); }
audio.addEventListener('timeupdate',()=>{
  if(!cur) return; const c=audio.currentTime; let idx=-1;
  cur.segs.forEach((s,i)=>{ if(s.t<=c+0.05) idx=i; });
  document.querySelectorAll('.seg').forEach(e=>{ const on=+e.dataset.i===idx && !audio.paused; if(on&&!e.classList.contains('play')){ e.scrollIntoView({block:'nearest',behavior:'smooth'}); } e.classList.toggle('play',on); });
});
audio.addEventListener('pause',()=>document.querySelectorAll('.seg.play').forEach(e=>e.classList.remove('play')));

// ---------- speakers ----------
function updSpkBtn(){ if(!cur) return; if(curSpk>=cur.speakers.length) curSpk=0; const b=$('curSpkBtn'); b.textContent='🗣 '+cur.speakers[curSpk]; b.style.boxShadow=`inset 3px 0 0 ${COLORS[curSpk%COLORS.length]}`; }
function cycleCurSpk(){ if(!cur) return; curSpk=(curSpk+1)%cur.speakers.length; updSpkBtn(); }
function openSpk(){ if(!cur) return; drawSpk(); $('spkOv').classList.add('show'); }
function drawSpk(){
  $('spkRows').innerHTML=cur.speakers.map((n,k)=>`<div class="row"><span class="cl" style="background:${COLORS[k%COLORS.length]}"></span><input value="${esc(n)}" data-k="${k}"></div>`).join('');
  $('spkRows').querySelectorAll('input').forEach(inp=>inp.oninput=()=>{ cur.speakers[+inp.dataset.k]=inp.value||(t('speaker')+' '+(+inp.dataset.k+1)); save(); });
}
function addSpk(){ cur.speakers.push('Speaker '+(cur.speakers.length+1)); save(); drawSpk(); }
function closeSpk(){ $('spkOv').classList.remove('show'); render(); updSpkBtn(); }

// ---------- live recording ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let state='idle', rec=null, mr=null, stream=null, chunks=[], base=0, startedAt=0, tick=null;
let interimText='', sess=0, startMap={}, doneSet={}, lastErr='';
const elapsed=()=>base+(state==='rec'?(performance.now()-startedAt)/1000:0);

function recMain(){ if(state==='idle') startRec(); else if(state==='rec') pauseRec(); else resumeRec(); }
function setUI(){
  const b=$('recBtn'), p=$('pill');
  b.textContent = state==='rec'?'❚❚':(state==='paused'?'▶':'●');
  b.classList.toggle('go', state==='paused');
  $('stopBtn').disabled = state==='idle';
  p.classList.toggle('recording', state==='rec');
  if(state!=='idle'){ $('player').style.display='none'; }
}
async function startRec(){
  if(!SR){ showWarn(t('noSR')); return; }
  if(!cur) newNote();
  if(cur.segs.length){ if(!confirm(t('newRecQ'))) return; newNote(); }
  audio.pause();
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); }
  catch(e){ showWarn(t('micDenied')); return; }
  showWarn('');
  chunks=[];
  try{ mr=new MediaRecorder(stream); mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); }; mr.start(1000); }catch(e){ mr=null; }
  base=0; startedAt=performance.now(); state='rec'; interimText=''; startMap={}; doneSet={};
  startSR(); setUI(); render();
  tick=setInterval(()=>{ $('clock').textContent=fmt(elapsed(),true); },100);
}
function startSR(){
  sess++; const my=sess;
  rec=new SR(); rec.lang=$('srLang').value; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=1;
  rec.onresult=e=>{
    let im='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i], k=my+'-'+i, txt=r[0].transcript;
      if(startMap[k]===undefined) startMap[k]=Math.max(0,elapsed()-1);
      if(r.isFinal){
        if(doneSet[k]) continue; doneSet[k]=1;
        const clean=txt.trim(); if(!clean) continue;
        cur.segs.push({t:startMap[k],end:elapsed(),text:clean.charAt(0).toUpperCase()+clean.slice(1),spk:curSpk,star:false});
        cur.duration=elapsed(); save();
      } else im+=txt;
    }
    interimText=im.trim(); render(); const box=$('transcript'); box.scrollTop=box.scrollHeight;
  };
  rec.onerror=e=>{ lastErr=e.error; if(e.error==='not-allowed'||e.error==='service-not-allowed'){ showWarn(t('micDenied')); stopRec(); } else if(e.error==='network'){ showWarn(t('netLost')); if(state==='rec') pauseRec(); } };
  rec.onend=()=>{ if(state==='rec' && my===sess){ setTimeout(()=>{ if(state==='rec'&&my===sess){ try{ startSR(); }catch(e){} } },250); } };
  try{ rec.start(); }catch(e){}
}
function flushInterim(){ if(interimText){ const c=interimText; cur.segs.push({t:Math.max(0,elapsed()-2),end:elapsed(),text:c.charAt(0).toUpperCase()+c.slice(1),spk:curSpk,star:false}); interimText=''; } }
function pauseRec(){ base=elapsed(); state='paused'; sess++; try{rec.stop();}catch(e){} flushInterim(); if(mr&&mr.state==='recording') try{mr.pause();}catch(e){} cur.duration=base; save(); setUI(); render(); }
function resumeRec(){ showWarn(''); startedAt=performance.now(); state='rec'; if(mr&&mr.state==='paused') try{mr.resume();}catch(e){} startSR(); setUI(); render(); }
function stopRec(){
  if(state==='idle') return;
  const wasRec=state==='rec'; const end=elapsed(); flushInterim();
  state='idle'; sess++; clearInterval(tick); try{rec.stop();}catch(e){}
  cur.duration=end; save();
  const note=cur;
  if(mr && mr.state!=='inactive'){
    mr.onstop=async()=>{
      const blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'});
      if(blob.size){ try{ await putAudio(note.id,blob); note.hasAudio=true; note.audioType=blob.type; save(); if(cur===note){ if(audioUrl) URL.revokeObjectURL(audioUrl); audioUrl=URL.createObjectURL(blob); audio.src=audioUrl; $('player').style.display='flex'; } }catch(e){} }
      stream&&stream.getTracks().forEach(tr=>tr.stop());
    };
    try{ mr.stop(); }catch(e){}
  } else { stream&&stream.getTracks().forEach(tr=>tr.stop()); }
  $('clock').textContent=fmt(end,true);
  setUI(); renderList(); render();
}

// ---------- upload + Whisper (runs in browser) ----------
let pendingFile=null, whisper={}, upTimer=null;
function onFile(inp){ const f=inp.files[0]; inp.value=''; if(!f||state!=='idle') return; pendingFile=f;
  $('upFileName').textContent=f.name; const sl=$('srLang'); $('upLangName').textContent=sl.options[sl.selectedIndex].text; $('upSetup').style.display='block'; $('upRun').style.display='none'; $('upOv').classList.add('show'); }
function closeUp(){ $('upOv').classList.remove('show'); clearInterval(upTimer); }
function upStatus(msg,pct){ $('upStatus').textContent=msg; const b=$('upBar'); if(pct==null){ b.classList.add('ind'); b.firstElementChild.style.width=''; } else { b.classList.remove('ind'); b.firstElementChild.style.width=pct+'%'; } }
async function decode16k(file){
  const buf=await file.arrayBuffer();
  const AC=window.AudioContext||window.webkitAudioContext; const ac=new AC();
  const ab=await new Promise((res,rej)=>{ const p=ac.decodeAudioData(buf,res,rej); if(p&&p.then) p.then(res,rej); });
  ac.close&&ac.close();
  const len=Math.ceil(ab.duration*16000);
  const oc=new OfflineAudioContext(1,len,16000); const src=oc.createBufferSource(); src.buffer=ab; src.connect(oc.destination); src.start();
  const out=await oc.startRendering(); return {data:out.getChannelData(0),duration:ab.duration};
}
async function runWhisper(){
  const f=pendingFile; if(!f) return;
  const lc=$('srLang').value.slice(0,2), isEn=lc==='en';
  const model=isEn?$('model').value:$('model').value.replace('.en','');
  const wLang={zh:'chinese',es:'spanish',ja:'japanese'}[lc];
  $('upSetup').style.display='none'; $('upRun').style.display='block';
  const t0=Date.now(); clearInterval(upTimer); upTimer=setInterval(()=>$('upTime').textContent=t('elapsed')+' '+fmt((Date.now()-t0)/1000),500);
  try{
    if(!whisper[model]){
      upStatus(t('loadModel'),0);
      const files={};
      const {pipeline}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1');
      whisper[model]=await pipeline('automatic-speech-recognition',model,{progress_callback:p=>{
        if(p.status==='progress'&&p.total){ files[p.file]=[p.loaded,p.total]; let a=0,b=0; Object.values(files).forEach(v=>{a+=v[0];b+=v[1];}); upStatus(t('loadModel')+' '+Math.round(a/1e6)+' / '+Math.round(b/1e6)+' MB',Math.round(a/b*100)); }
      }});
    }
    upStatus(t('decoding'),null);
    const {data,duration}=await decode16k(f);
    upStatus(t('transcribing'),null);
    const opt={chunk_length_s:30,stride_length_s:5,return_timestamps:true}; if(!isEn){ opt.language=wLang; opt.task='transcribe'; }
    const out=await whisper[model](data,opt);
    const n=newNote(false);
    n.title=f.name.replace(/\.[^.]+$/,''); n.duration=duration; n.speakers=['Speaker 1','Speaker 2'];
    const ch=(out.chunks&&out.chunks.length)?out.chunks:[{timestamp:[0,duration],text:out.text||''}];
    n.segs=ch.map(c=>({t:c.timestamp[0]||0,end:c.timestamp[1]??duration,text:(c.text||'').trim(),spk:0,star:false})).filter(s=>s.text);
    try{ await putAudio(n.id,f); n.hasAudio=true; n.audioType=f.type; }catch(e){}
    save(); upStatus(t('upDone'),100); clearInterval(upTimer);
    setTimeout(()=>{ closeUp(); openNote(n.id); },500);
  }catch(e){
    clearInterval(upTimer); console.error(e);
    const msg=String(e&&e.message||e);
    upStatus(t('upFail')+msg+(/fetch|network|load|import/i.test(msg)?' — '+t('netFail'):''),0);
    $('upSetup').style.display='block';
  }
}

// ---------- export ----------
function lines(){ return cur?cur.segs:[]; }
function exportTxt(){ closeMenus(); const s=lines(); if(!s.length) return toast(t('nothing'));
  const head=(cur.title||t('untitled'))+'\n'+new Date(cur.created).toLocaleString()+'\n\n';
  const body=s.map(x=>`[${fmt(x.t)}] ${cur.speakers[x.spk]||''}: ${x.text}`).join('\n\n');
  download(safeName(cur.title)+'.txt',new Blob([head+body],{type:'text/plain;charset=utf-8'})); }
function srtT(s){ s=Math.max(0,s); const ms=Math.round(s*1000); const h=Math.floor(ms/3600000),m=Math.floor(ms/60000)%60,x=Math.floor(ms/1000)%60,r=ms%1000; return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')},${String(r).padStart(3,'0')}`; }
function exportSrt(){ closeMenus(); const s=lines(); if(!s.length) return toast(t('nothing'));
  const body=s.map((x,i)=>{ const e=Math.max(x.end||0,(s[i+1]?Math.min(s[i+1].t,x.t+8):x.t+4), x.t+1); return `${i+1}\n${srtT(x.t)} --> ${srtT(e)}\n${cur.speakers[x.spk]||''}: ${x.text}\n`; }).join('\n');
  download(safeName(cur.title)+'.srt',new Blob([body],{type:'text/plain;charset=utf-8'})); }
async function copyAll(){ closeMenus(); const s=lines(); if(!s.length) return toast(t('nothing'));
  const txt=s.map(x=>`${cur.speakers[x.spk]||''}: ${x.text}`).join('\n');
  try{ await navigator.clipboard.writeText(txt); }catch(e){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast(t('copied')); }
async function exportAudio(){ closeMenus(); if(!cur||!cur.hasAudio) return toast(t('noAudio'));
  const b=await getAudio(cur.id); if(!b) return toast(t('noAudio'));
  const ty=b.type||''; const ext=b.name?b.name.split('.').pop():(ty.includes('mp4')?'m4a':ty.includes('ogg')?'ogg':'webm');
  download(safeName(cur.title)+'.'+ext,b); }
function toggleMenu(e){ e.stopPropagation(); $('expMenu').classList.toggle('open'); }
function closeMenus(){ $('expMenu').classList.remove('open'); }
document.addEventListener('click',closeMenus);

// keyboard: space = record/pause when not typing
document.addEventListener('keydown',e=>{ if(e.code==='Space' && !e.target.closest('input,textarea,select,[contenteditable]')){ e.preventDefault(); recMain(); } });
window.addEventListener('beforeunload',e=>{ if(state!=='idle'){ e.preventDefault(); e.returnValue=''; } });

// ---------- init ----------
{ const sv=localStorage.getItem('tr_srlang'); if(sv&&[...$('srLang').options].some(o=>o.value===sv)) $('srLang').value=sv; }
if(!notes.length) newNote(false);
cur=notes[0];
applyLang(); openNote(cur.id); setUI();
</script>
